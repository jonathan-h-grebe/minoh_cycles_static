<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/minoh_cycles_contrast_smaller.jpg">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        div {
            font-size: 1.5rem;
            color: #333;
            text-align: center;
        }
        /* The styling for both names */
        .brand-name {
            font-weight: bold;
            color: #007bff;
        }
        #dots {
            display: inline-block;
            width: 3em;
            text-align: left;
        }
    </style>
</head>
<body>

    <div>
        Minoh Cycles has been renamed to <span class="brand-name">Minoh Cycle Tours</span>.
    </div>
    
    <div id="message">
        Redirecting to <span class="brand-name">https://minohcycletours.com</span><span id="dots" style="color: transparent">・・・</span>
    </div>

    <script>
        // We now target the specific 'dots' span instead of the whole div
        const dotsElement = document.getElementById('dots');
        let secondsPassed = 0;

        const timer = setInterval(() => {
            secondsPassed++;
            
            // This only updates the empty span at the end
            dotsElement.textContent = '・'.repeat(secondsPassed);
            dotsElement.style.color = '';

            if (secondsPassed >= 3) {
                clearInterval(timer);
                
                setTimeout(() => {
                    console.log("Redirecting now...");
                    window.location.href = "https://minohcycletours.com"; 
                }, 600);
            }
        }, 1000);
    </script>
</body>
</html>
